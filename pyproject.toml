[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "guardian"
version = "0.1.0"
description = "Personal memory graph for AI-assisted work."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "networkx>=3.3",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "watchdog>=6.0.0",
]

[project.scripts]
guardian-mcp = "src.mcp_server:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
