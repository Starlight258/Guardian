<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .h1 { font: 800 34px Inter, ui-sans-serif, system-ui; fill: #F8FAFC; }
      .body { font: 500 15px Inter, ui-sans-serif, system-ui; fill: #CBD5E1; }
      .label { font: 650 14px Inter, ui-sans-serif, system-ui; fill: #E0E7FF; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui; fill: #94A3B8; }
      .mono { font: 500 12px "SFMono-Regular", Consolas, monospace; fill: #A5B4FC; }
      .node { filter: url(#softGlow); }
      .edge { stroke: #64748B; stroke-width: 1.4; opacity: .55; }
      .edgeHot { stroke: #A78BFA; stroke-width: 2.2; opacity: .9; }
      .spin { animation: spin 18s linear infinite; transform-origin: 566px 366px; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="720" rx="36" fill="url(#bg2)"/>
  <circle cx="1120" cy="72" r="180" fill="#4F46E5" opacity=".12"/>
  <circle cx="110" cy="690" r="210" fill="#14B8A6" opacity=".08"/>

  <text x="64" y="70" class="h1">Guardian Dashboard</text>
  <text x="65" y="100" class="body">Obsidian 노트와 Claude Code 프롬프트가 하나의 지식 그래프로 연결된다.</text>

  <g transform="translate(52 132)">
    <rect width="1096" height="526" rx="28" fill="#020617" stroke="#334155" stroke-width="2"/>

    <g transform="translate(24 24)">
      <rect width="220" height="478" rx="22" fill="#0F172A" stroke="#1E293B"/>
      <text x="22" y="38" class="label">Sources</text>
      <rect x="20" y="66" width="180" height="44" rx="12" fill="#111827" stroke="#334155"/>
      <text x="38" y="93" class="body">Obsidian Notes</text>
      <rect x="20" y="124" width="180" height="44" rx="12" fill="#111827" stroke="#334155"/>
      <text x="38" y="151" class="body">Claude Prompts</text>
      <rect x="20" y="182" width="180" height="44" rx="12" fill="#111827" stroke="#334155"/>
      <text x="38" y="209" class="body">Semantic Edges</text>

      <text x="22" y="272" class="label">This week</text>
      <text x="24" y="306" class="small">Captured prompts</text>
      <text x="154" y="306" class="mono">128</text>
      <text x="24" y="336" class="small">Linked notes</text>
      <text x="163" y="336" class="mono">42</text>
      <text x="24" y="366" class="small">Recall hits</text>
      <text x="170" y="366" class="mono">17</text>

      <rect x="20" y="410" width="180" height="44" rx="12" fill="#312E81" stroke="#818CF8"/>
      <text x="40" y="437" class="body">Open Angel Feed</text>
    </g>

    <g class="spin">
      <line x1="505" y1="346" x2="650" y2="236" class="edgeHot"/>
      <line x1="505" y1="346" x2="720" y2="376" class="edge"/>
      <line x1="505" y1="346" x2="598" y2="488" class="edgeHot"/>
      <line x1="650" y1="236" x2="788" y2="276" class="edge"/>
      <line x1="650" y1="236" x2="720" y2="376" class="edgeHot"/>
      <line x1="720" y1="376" x2="598" y2="488" class="edge"/>
      <line x1="720" y1="376" x2="850" y2="455" class="edgeHot"/>
      <line x1="598" y1="488" x2="412" y2="470" class="edge"/>
      <line x1="412" y1="470" x2="360" y2="314" class="edgeHot"/>
      <line x1="360" y1="314" x2="505" y2="346" class="edge"/>
      <line x1="788" y1="276" x2="850" y2="455" class="edge"/>
      <line x1="412" y1="470" x2="598" y2="488" class="edgeHot"/>
    </g>

    <circle cx="505" cy="346" r="38" fill="#A78BFA" class="node pulse"/>
    <circle cx="650" cy="236" r="28" fill="#22C55E" class="node"/>
    <circle cx="720" cy="376" r="34" fill="#38BDF8" class="node"/>
    <circle cx="598" cy="488" r="30" fill="#FDE68A" class="node"/>
    <circle cx="788" cy="276" r="22" fill="#F472B6" class="node"/>
    <circle cx="850" cy="455" r="26" fill="#FB7185" class="node"/>
    <circle cx="412" cy="470" r="24" fill="#34D399" class="node"/>
    <circle cx="360" cy="314" r="20" fill="#60A5FA" class="node"/>

    <text x="464" y="350" class="label">RAG</text>
    <text x="622" y="241" class="small">chunking</text>
    <text x="683" y="381" class="small">retrieval</text>
    <text x="561" y="493" class="small">Obsidian</text>
    <text x="764" y="281" class="small">prompt</text>
    <text x="816" y="460" class="small">decision</text>
    <text x="381" y="475" class="small">graph</text>
    <text x="330" y="319" class="small">MCP</text>

    <g transform="translate(874 48)">
      <rect width="190" height="186" rx="22" fill="#0F172A" stroke="#334155"/>
      <text x="20" y="35" class="label">Cluster Insight</text>
      <text x="20" y="68" class="small">Most active topic</text>
      <text x="20" y="96" class="body">Agentic IDE</text>
      <text x="20" y="132" class="small">Repeated question risk</text>
      <text x="20" y="160" class="body">High · 3 similar prompts</text>
    </g>

    <g transform="translate(852 380)">
      <rect width="212" height="122" rx="22" fill="#312E81" stroke="#818CF8"/>
      <text x="22" y="38" class="label">Angel says</text>
      <text x="22" y="70" class="body">이 노드는 최근 Claude</text>
      <text x="22" y="96" class="body">질문과 강하게 연결돼요.</text>
    </g>
  </g>

  <text x="64" y="694" class="small">Guardian · Personal Knowledge Graph for AI-assisted work</text>
</svg>